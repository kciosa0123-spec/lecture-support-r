<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>教員ダッシュボード（龍谷大・タイムテーブル版）</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background: #f4f7f6; line-height: 1.6; }
    .box { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    /* 曜日ごとの3列レイアウト */
    .timetable-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .day-column { background: #ebedef; padding: 15px; border-radius: 8px; }
    .day-title { font-weight: bold; text-align: center; margin-bottom: 15px; color: #444; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    
    /* 科目ボタン */
    .subject-group { margin-bottom: 15px; }
    .subject-btn { width: 100%; background: #fff; color: #333; border: 1px solid #bbb; padding: 10px; border-radius: 6px; text-align: left; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .subject-btn:hover { background: #f0f0f0; border-color: #4285f4; }
    .subject-btn.active { background: #4285f4; color: #fff; border-color: #4285f4; }

    /* 回数グリッド (1-15) */
    .session-grid-mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; padding: 5px; background: rgba(255,255,255,0.5); border-radius: 4px; display: none; }
    .session-btn { background: #ddd; border: none; font-size: 10px; padding: 5px 0; border-radius: 3px; cursor: pointer; color: #666; }
    .session-btn.has-data { background: #34a853; color: #fff; font-weight: bold; } /* データがある回は緑 */
    .session-btn:hover { opacity: 0.8; }
    .session-btn.selected { ring: 2px solid #000; outline: 2px solid #4285f4; }

    /* その他UI要素 */
    button { color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-blue { background: #4285f4; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }
    .btn-secondary { background: #6c757d; }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    .question-card { background: white; border: 1px solid #ddd; border-left: 4px solid #4285f4; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
    .question-card.answered { border-left-color: #28a745; opacity: 0.6; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>講義支援・スマートアーカイブ（龍谷大）</h2>

  <div id="login-section" class="box" style="text-align: center; padding: 40px;">
    <button id="login-btn" type="button" class="btn-blue" style="font-size: 18px;">Googleでログイン</button>
  </div>

  <div id="dashboard-section" class="hidden">
    
    <div class="timetable-grid">
      <div class="day-column">
        <div class="day-title">月曜日</div>
        <div id="subjects-mon"></div>
      </div>
      <div class="day-column">
        <div class="day-title">火曜日</div>
        <div id="subjects-tue"></div>
      </div>
      <div class="day-column">
        <div class="day-title">金曜日</div>
        <div id="subjects-fri"></div>
      </div>
    </div>

    <div class="box" id="active-panel" style="border-top: 5px solid #4285f4;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="font-size: 12px; color: #666;">選択中:</span>
          <h3 id="current-display-label" style="margin: 0;">講義を選択してください</h3>
        </div>
        <div id="data-actions" class="hidden">
          <button id="export-csv-btn" class="btn-success">CSV出力</button>
          <button id="delete-btn" class="btn-danger" style="margin-left:10px;">この回を削除</button>
        </div>
        <div id="start-actions">
          <button id="start-lecture-btn" class="btn-warning">この設定で講義を開始</button>
          <button id="end-lecture-btn" class="btn-danger hidden">講義を終了</button>
        </div>
      </div>
    </div>

    <div class="box">
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <div style="font-weight: bold;">出席者: <span id="att-count">0</span> 名</div>
        <button id="toggle-list-btn" class="btn-secondary" style="padding: 4px 10px; font-size: 11px;">名簿を表示/非表示</button>
      </div>
      <div id="att-list-container" class="hidden">
        <table>
          <thead><tr><th>学籍番号</th><th>氏名</th><th>時刻</th></tr></thead>
          <tbody id="att-list-body"></tbody>
        </table>
      </div>
      <hr>
      <div id="questions-container"></div>
    </div>

    <div style="text-align: right; margin-top: 20px;">
      <button id="logout-btn" class="btn-secondary" style="font-size: 11px;">ログアウト</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, set, get, onValue, update, remove, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAEaNHXsSc7oB9Shgz4sj-OptSwKtVzkWc",
    authDomain: "lecture-support.firebaseapp.com",
    databaseURL: "https://lecture-support-default-rtdb.firebaseio.com",
    projectId: "lecture-support",
    storageBucket: "lecture-support.firebasestorage.app",
    messagingSenderId: "285290664467",
    appId: "1:285290664467:web:b39a07bbb08da6fc45a5e6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ hd: "mail.ryukoku.ac.jp" });

  const TEACHER_EMAIL = "osada@mail.ryukoku.ac.jp";
  
  // 先生の時間割データ
  const timetable = {
    mon: ["英語総合3(B)", "英語総合3", "英語総合１(A)"],
    tue: ["英語総合１(A)", "英語総合１(A)", "英語総合１(A)"],
    fri: ["英語総合１(B)", "英語総合１(B)", "英語総合３", "英語総合３"]
  };

  let currentSelectedSub = "";
  let currentSelectedNum = "";
  let viewingSessionId = "";
  let activeSessionId = "";

  // UI生成：曜日・科目ボタン
  Object.keys(timetable).forEach(day => {
    const container = document.getElementById(`subjects-${day}`);
    timetable[day].forEach(sub => {
      const group = document.createElement('div');
      group.className = 'subject-group';
      group.innerHTML = `<button class="subject-btn" onclick="window.toggleSubject(this, '${day}', '${sub}')">${sub}</button>
                         <div class="session-grid-mini" id="grid-${day}-${sub}"></div>`;
      container.appendChild(group);
      
      // 1-15回のボタンを生成
      const grid = group.querySelector('.session-grid-mini');
      for(let i=1; i<=15; i++) {
        const b = document.createElement('button');
        b.className = 'session-btn';
        b.innerText = i;
        b.id = `btn-${day}-${sub}-${i}`;
        b.onclick = () => window.loadSession(day, sub, i);
        grid.appendChild(b);
      }
    });
  });

  // 科目クリックで回数グリッドを表示
  window.toggleSubject = (btn, day, sub) => {
    document.querySelectorAll('.session-grid-mini').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.subject-btn').forEach(el => el.classList.remove('active'));
    const grid = document.getElementById(`grid-${day}-${sub}`);
    grid.style.display = 'grid';
    btn.classList.add('active');
    currentSelectedSub = sub;
    // データがある回を光らせるスキャン
    scanDataPresence(day, sub);
  };

  // どの回にデータがあるかDBをチェックして色を変える
  async function scanDataPresence(day, sub) {
    const snap = await get(ref(db, 'attendance'));
    const allAtt = snap.val() || {};
    for(let i=1; i<=15; i++) {
      const possibleId = `ANYDATE_${day}${sub}第${i}回`; // IDの部分一致で探す
      const found = Object.keys(allAtt).find(id => id.includes(`${day}`) && id.includes(`${sub}`) && id.includes(`第${i}回`));
      const btn = document.getElementById(`btn-${day}-${sub}-${i}`);
      if(found) {
        btn.classList.add('has-data');
        btn.dataset.actualId = found; // 本物のIDを保存
      }
    }
  }

  // 特定の回をロード
  window.loadSession = (day, sub, num) => {
    const btn = document.getElementById(`btn-${day}-${sub}-${num}`);
    const id = btn.dataset.actualId || `2026MMDD_${day}${sub}第${num}回`; // 未実施なら仮ID
    currentSelectedNum = num;
    viewingSessionId = id;
    
    document.querySelectorAll('.session-btn').forEach(el => el.classList.remove('selected'));
    btn.classList.add('selected');
    
    document.getElementById('current-display-label').innerText = `${sub} 第${num}回`;
    
    if(btn.classList.contains('has-data')) {
      document.getElementById('data-actions').classList.remove('hidden');
      document.getElementById('start-lecture-btn').innerText = "データを更新（再開）";
    } else {
      document.getElementById('data-actions').classList.add('hidden');
      document.getElementById('start-lecture-btn').innerText = "この設定で講義を開始";
    }
    
    // 表示更新
    if (viewingSessionId) off(ref(db, `attendance/${viewingSessionId}`));
    startMonitoring(id);
  };

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === TEACHER_EMAIL) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('user-info').innerText = user.email;
      
      // 開講中セッションの監視
      onValue(ref(db, 'active_session'), (snap) => {
        const val = snap.val();
        activeSessionId = val ? val.id : "";
        const endBtn = document.getElementById('end-lecture-btn');
        if(val && val.isOpen) {
          endBtn.classList.remove('hidden');
        } else {
          endBtn.classList.add('hidden');
        }
      });
    }
  });

  // 講義開始
  document.getElementById('start-lecture-btn').onclick = async () => {
    if(!currentSelectedSub || !currentSelectedNum) return alert("講義と回数を選択してください。");
    const dStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
    const dayName = document.querySelector('.subject-btn.active').parentElement.parentElement.querySelector('.day-title').innerText;
    const dayKey = dayName.charAt(0);
    const title = `${dayKey}${currentSelectedNum}${currentSelectedSub}第${currentSelectedNum}回`;
    const id = `${dStr}_${title}`;
    
    await set(ref(db, 'active_session'), { id: id, title: title, isOpen: true });
    alert("講義を開始しました。学生が送信可能になります。");
    location.reload();
  };

  // 講義終了
  document.getElementById('end-lecture-btn').onclick = async () => {
    if(confirm("講義を終了しますか？")) {
      await remove(ref(db, 'active_session'));
      location.reload();
    }
  };

  function startMonitoring(sessionId) {
    const attBody = document.getElementById('att-list-body');
    const qCont = document.getElementById('questions-container');
    
    onValue(ref(db, `attendance/${sessionId}`), (s) => {
      const data = s.val() || {};
      const list = Object.values(data).sort((a,b) => (a.studentId||"").localeCompare(b.studentId||""));
      document.getElementById('att-count').innerText = list.length;
      attBody.innerHTML = list.map(e => `<tr><td>${e.studentId}</td><td>${e.name}</td><td>${new Date(e.timestamp).toLocaleTimeString()}</td></tr>`).join('');
    });

    onValue(ref(db, `questions/${sessionId}`), (s) => {
      const data = s.val() || {};
      qCont.innerHTML = Object.keys(data).reverse().map(key => {
        const q = data[key];
        return `<div class="question-card ${q.answered?'answered':''}">
          <small>${q.email}</small>
          <button onclick="window.toggleQ('${key}', ${!q.answered})" style="float:right; background:${q.answered?'#28a745':'#ffc107'}; color:${q.answered?'#fff':'#333'}; padding:2px 8px; font-size:11px;">${q.answered?'済':'未'}</button>
          <div style="font-weight:bold; margin-top:5px;">${q.text}</div>
        </div>`;
      }).join('');
    });
  }

  window.toggleQ = (key, val) => update(ref(db, `questions/${viewingSessionId}/${key}`), { answered: val });

  document.getElementById('export-csv-btn').onclick = async () => {
    const snap = await get(ref(db, `attendance/${viewingSessionId}`));
    const data = snap.val() || {};
    let csv = "\uFEFF学籍番号,氏名,時刻\n";
    Object.values(data).forEach(e => csv += `${e.studentId},${e.name},${new Date(e.timestamp).toLocaleString()}\n`);
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${viewingSessionId}.csv`;
    a.click();
  };

  document.getElementById('delete-btn').onclick = async () => {
    if(confirm("この回のデータを完全に削除しますか？")) {
      await Promise.all([remove(ref(db, `attendance/${viewingSessionId}`)), remove(ref(db, `questions/${viewingSessionId}`))]);
      location.reload();
    }
  };

  document.getElementById('toggle-list-btn').onclick = () => document.getElementById('att-list-container').classList.toggle('hidden');
  document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
  document.getElementById('logout-btn').onclick = () => signOut(auth).then(()=>location.reload());
</script>
</body>
</html>
